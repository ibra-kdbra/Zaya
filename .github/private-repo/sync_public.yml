# Lives in the PRIVATE repo at .github/workflows/sync_public.yml
name: Sync public subset to ibra-kdbra/Zaya

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          path: private
          fetch-depth: 0

      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          repository: ibra-kdbra/Zaya
          token: ${{ secrets.PUBLIC_SYNC_TOKEN }}
          path: public
          fetch-depth: 0

      - name: Copy public subset
        run: |
          rsync -a --delete \
            --exclude '.git/' \
            --exclude-from=private/.publicignore \
            private/ public/

      - name: Fail if anything private leaked
        run: |
          cd public
          if grep -rIl --exclude-dir=.git -E "pro-features/[a-z]|ZAYA_PRO_|PRO_LICENSE" . ; then
            echo "::error::Private reference found in public tree"; exit 1
          fi

      - name: Commit & push
        run: |
          cd public
          git config user.name  "ibra-kdbra"
          git config user.email "git-repo-develop@outlook.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to sync"; exit 0; fi
          # Mirror the private commit subject so history stays readable
          SUBJECT="$(git -C ../private log -1 --pretty=%s)"
          git commit -m "$SUBJECT" -m "Synced from zaya-pro@$(git -C ../private rev-parse --short HEAD)"
          git push origin HEAD:main
