name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Syntax, lint & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dev tooling
        run: npm ci

      - name: Syntax-check every first-party script
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium

      - name: Smoke test (loads index.html and changelog.html in a headless browser)
        run: npm test
