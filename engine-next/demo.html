<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The deployment's policy, so the demo proves the engine runs under it. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob:; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';">
<title>engine-next demo</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="engine.css">
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    background: #15171c; color: #e8eaed;
    font: 14px/1.5 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 10px 14px; border-bottom: 1px solid #2c313a; background: #1b1e24;
  }
  button, select {
    font: inherit; color: inherit; background: #262b33;
    border: 1px solid #3a414c; border-radius: 6px; padding: 6px 12px; cursor: pointer;
  }
  button:hover, select:hover { background: #303743; }
  label { display: inline-flex; align-items: center; gap: 6px; color: #aab2c0; }
  #status { margin-left: auto; font-variant-numeric: tabular-nums; color: #aab2c0; }
  #book { flex: 1 1 auto; min-height: 0; }
  #error { padding: 12px 14px; color: #ff9a9a; }
  #panels { border-top: 1px solid #2c313a; background: #1b1e24; max-height: 190px; overflow: auto; }
  .strip { display: flex; gap: 10px; padding: 10px 14px; }
  .strip figure { margin: 0; text-align: center; color: #aab2c0; font-size: 12px; }
  .strip canvas { display: block; border: 1px solid #3a414c; border-radius: 3px; background: #fff; }
  #outlineList { margin: 0; padding: 10px 14px 10px 32px; }
  #outlineList ol { padding-left: 18px; }
  #outlineList button { padding: 2px 8px; border: 0; background: none; color: #9dc4ff; cursor: pointer; }
</style>
</head>
<body>
<header>
  <button id="prev" type="button">Previous</button>
  <button id="next" type="button">Next</button>
  <label>Pages
    <select id="mode">
      <option value="double">Double</option>
      <option value="single">Single</option>
    </select>
  </label>
  <label>Direction
    <select id="dir">
      <option value="ltr">Left to right</option>
      <option value="rtl">Right to left</option>
    </select>
  </label>
  <label>Covers
    <select id="hard">
      <option value="none">Soft</option>
      <option value="cover">Hard covers</option>
      <option value="all">All hard</option>
    </select>
  </label>
  <button id="zoomOut" type="button">Zoom out</button>
  <button id="zoomIn" type="button">Zoom in</button>
  <button id="zoomReset" type="button">Fit</button>
  <button id="fullscreen" type="button">Fullscreen</button>
  <label><input id="textLayer" type="checkbox" checked> Text layer</label>
  <button id="thumbs" type="button">Thumbnails</button>
  <button id="outline" type="button">Outline</button>
  <button id="dispose" type="button">Dispose</button>
  <span id="status">loading…</span>
</header>
<div id="book"></div>
<!--
  The panels below are the demo's own, built from what the engine exposes as data. The engine
  ships no panel of its own: see the "Data for panels" section of docs/engine-api.md.
-->
<aside id="panels" hidden>
  <div id="thumbStrip" class="strip" hidden></div>
  <ol id="outlineList" hidden></ol>
</aside>
<p id="error" hidden></p>

<script type="module" src="demo.js"></script>

</body>
</html>
